<!doctype html><html lang="it"><head><meta charset="utf-8"><title>La riforma del 1993</title></head><body><main><h1>1993 — La riforma</h1><p>Nel 1993 il Parlamento italiano modificò la disciplina delle immunità parlamentari, riducendo l'ambito della tutela prevista in precedenza e mantenendo le garanzie legate all'esercizio delle funzioni parlamentari.</p></main></body></html>
